<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Paragraph session</title>
    </head>
    <body>
        <!-- <p> is a block-level element. It starts on a new line and takes the full available width. -->
     <p>Mahmoud Khalid</p>
     <p>Mahmoud Khalid</p>
      
     <!-- <span> is an inline element. It stays on the same line and only takes up the space its content needs. -->
     <span>Mahmoud Khalid</span>
     <span>Mahmoud Khalid</span>


     <!-- <b> makes text bold without adding importance. -->
<p>Price: <b>$1200</b></p>

<!-- <strong> makes text bold and indicates that it is important. -->
<p><strong>Payment is required before shipping.</strong></p>

<!-- <i> displays text in italic without emphasizing it. -->
<p><i>Book Title</i></p>

<!-- <em> emphasizes text and is usually displayed in italic. -->
<p>Please <em>read this carefully</em>.</p>

<!-- <mark> highlights text. -->
<p><mark>Warning:</mark> Save your work before closing.</p>

<!-- <u> underlines text without indicating it was inserted. -->
<p><u>Underlined text</u></p>

<!-- <ins> represents inserted text and is usually underlined. -->
<p>This feature was <ins>added today</ins>.</p>

<!-- <s> shows text that is no longer accurate or relevant. -->
<p>Old Price: <s>$1500</s></p>

<!-- <del> represents deleted text. -->
<p>I like <del>tea</del> coffee.</p>

<!-- <sub> displays subscript text. -->
<p>H<sub>2</sub>O</p>

<!-- <sup> displays superscript text. -->
<p>x<sup>2</sup></p>
    
     
    </body>
</html>
